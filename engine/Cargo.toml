[package]
name = "torrent-engine"
version = "0.1.0"
edition = "2021"
description = "Download-only BitTorrent engine"

[dependencies]
anyhow = "1"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
trash = "5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
