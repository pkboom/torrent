[package]
name = "torrent-app"
version = "0.1.0"
edition = "2021"
description = "Torrent: a download-only BitTorrent client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
torrent-engine = { path = "../../engine" }
